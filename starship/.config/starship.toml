# Sets user-defined palette
palette = "catppuccin_mocha"

# Setups
format="""[╭─](fg:black) $directory $git_branch $git_status
[╰─](fg:black)$character
"""
right_format = """$cmd_duration"""
add_newline = true

[conda]
format = ' [$symbol$environment](dimmed green) '

# Prompt symbols 
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[](peach)"

[directory]
format = "[ ](fg:blue) [$path](fg:blue bold)"
style = "fg:text"
truncation_length = 3
truncate_to_repo=false

[git_branch]
format = "[[ ](fg:green bold)$branch](fg:green)"
style = "bg:none fg:surface1"

[git_status]
format = "[$all_status$ahead_behind](fg:yellow)"
style = "bg:none fg:surface1"
conflicted = " "
ahead =	" ${count} "
behind = " ${count} "
diverged = " ${ahead_count} ${behind_count} "
up_to_date = "[ ](fg:green) "
untracked = "󰋗 ${count} "
stashed = " "
modified = "󰛿 !${count} "
staged = "󰐗 +${count} "
renamed = "󱍸 »${count} "
deleted = "󰍶 ${count} "

[cmd_duration]
min_time = 0
format = "[(fg:text bold)$duration](fg:text)"
disabled = false
style = "bg:none fg:surface1"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
